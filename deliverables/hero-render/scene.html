<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#0b0908;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const q = new URLSearchParams(location.search);
const W = +q.get('w') || 1920, H = +q.get('h') || 1080, PORTRAIT = H > W;
const FRAMES = +q.get('frames') || 300;          // one seamless loop
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.AgXToneMapping;
renderer.toneMappingExposure = 0.92;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0908);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.02).texture;
scene.environmentIntensity = 0.3;

const camera = new THREE.PerspectiveCamera(PORTRAIT ? 38 : 30, W / H, 0.1, 100);
camera.position.set(0, 0, PORTRAIT ? 24 : 18);
camera.lookAt(0, 0, 0);

// Lights: a warm key from above left, a cool rim from behind for glowing edges.
const key = new THREE.DirectionalLight(0xfff1df, 1.25); key.position.set(-8, 10, 6); scene.add(key);
const rim = new THREE.DirectionalLight(0xffe2b8, 2.8); rim.position.set(3, 6, -9); scene.add(rim);
const fill = new THREE.DirectionalLight(0xf3c9d6, 0.6); fill.position.set(8, -6, 6); scene.add(fill);

// A faint warm glow behind the cascade, so the black has depth.
{
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d'); const r = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  r.addColorStop(0, 'rgba(110,74,44,0.26)'); r.addColorStop(0.5, 'rgba(60,38,24,0.08)'); r.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = r; g.fillRect(0, 0, 256, 256);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  const m = new THREE.Mesh(new THREE.PlaneGeometry(40, 26), new THREE.MeshBasicMaterial({ map: t, transparent: true, depthWrite: false }));
  m.position.set(PORTRAIT ? 1 : 3, PORTRAIT ? 2 : 0.8, -12); scene.add(m);
}

const tex = await new THREE.TextureLoader().loadAsync('./marble.webp');
tex.colorSpace = THREE.SRGBColorSpace;
tex.anisotropy = renderer.capabilities.getMaxAnisotropy();

const gold = new THREE.MeshPhysicalMaterial({ color: 0xd8b26e, metalness: 1, roughness: 0.22, clearcoat: 0.6, clearcoatRoughness: 0.1 });
// Each slab shows its own crop of the marble.
const CROPS = [[0.05, 0.1], [0.42, 0.05], [0.62, 0.35], [0.2, 0.5], [0.7, 0.05], [0.0, 0.45], [0.5, 0.5], [0.3, 0.15], [0.78, 0.45], [0.12, 0.25]];
const face = i => {
  const t = tex.clone(); t.needsUpdate = true;
  t.repeat.set(0.3, 0.53); t.offset.set(...CROPS[i % CROPS.length]);
  return new THREE.MeshPhysicalMaterial({ map: t, roughness: 0.38, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.09, specularIntensity: 0.5 });
};

const N = 12, SPACING = 2.05, L = N * SPACING;
const geo = new RoundedBoxGeometry(3.2, 3.2, 0.2, 6, 0.14);
const slabs = [];
for (let i = 0; i < N; i++) {
  const f = face(i);
  // Box groups: +x, -x, +y, -y, +z (front), -z (back).
  const mesh = new THREE.Mesh(geo, [gold, gold, gold, gold, f, f]);
  scene.add(mesh); slabs.push(mesh);
}

// The cascade runs along a line from upper left (off screen) to the right.
const A = PORTRAIT ? new THREE.Vector3(-6.5, 12.5, -5) : new THREE.Vector3(-11.5, 6.8, -6);
const B = PORTRAIT ? new THREE.Vector3(6.5, -4.5, 3) : new THREE.Vector3(12.5, -5.2, 3);
const dir = B.clone().sub(A);

function place(t) {                      // t in [0, 1): one loop
  // A slow camera drift, one full cycle per loop.
  camera.position.x = 0.45 * Math.sin(t * Math.PI * 2);
  camera.position.y = 0.3 * Math.cos(t * Math.PI * 2);
  camera.lookAt(0, 0, 0);
  for (let i = 0; i < N; i++) {
    // Over one loop every slab travels the whole cycle back to its own spot,
    // so the last frame flows into the first with no jump.
    const s = (((i * SPACING + t * L) % L) + L) % L / L;   // 0..1 along the line
    const m = slabs[i];
    m.position.copy(A).addScaledVector(dir, s);
    // Slabs lean like dominoes and turn slowly as they travel.
    m.rotation.set(-0.6 + 0.1 * Math.sin(s * Math.PI * 2), 0.48 + 0.2 * s, 0.6 - 0.1 * s, 'XYZ');
    m.position.y += 0.22 * Math.sin(s * Math.PI * 4 + i);
  }
}

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(W, H), 0.32, 0.55, 0.9));
composer.addPass(new OutputPass());

window.renderFrame = i => { place(i / FRAMES); composer.render(); return renderer.domElement.toDataURL('image/png'); };
window.ready = true;
</script></body></html>
